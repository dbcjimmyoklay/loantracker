<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>借款還款進度追蹤</title>
<style>
  :root{
    --bg:#0f1115;
    --card:#171a21;
    --border:#262b35;
    --text:#e8eaed;
    --muted:#8a919e;
    --accent:#4f8cff;
    --good:#3ecf8e;
    --danger:#ff6b6b;
    --purple:#b48cff;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Microsoft JhengHei",sans-serif;
    background:var(--bg);
    color:var(--text);
    padding:24px 16px 50px;
  }
  .wrap{max-width:880px;margin:0 auto;}
  .headrow{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;}
  h1{font-size:20px;margin:0 0 4px;font-weight:600;}
  .sub{color:var(--muted);font-size:13px;margin-bottom:22px;}
  .lock-btn{
    font-size:11.5px;color:var(--muted);background:var(--card);border:1px solid var(--border);
    border-radius:8px;padding:6px 10px;cursor:pointer;white-space:nowrap;flex-shrink:0;
  }
  .lock-btn.unlocked{color:var(--good);border-color:rgba(62,207,142,.35);}

  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px;}
  .stat{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px 16px;}
  .stat .label{color:var(--muted);font-size:12px;margin-bottom:6px;}
  .stat .value{font-size:19px;font-weight:600;}
  .stat .value.accent{color:var(--accent);}
  .stat .value.good{color:var(--good);}

  .card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:16px;margin-bottom:16px;}

  .progress-bar-bg{width:100%;height:10px;background:#1e222b;border-radius:6px;overflow:hidden;margin-top:10px;}
  .progress-bar-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--good));transition:width .4s ease;}
  .progress-text{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:6px;}
  .row-top{display:flex;justify-content:space-between;align-items:baseline;}
  .row-top .title{font-size:13px;color:var(--muted);}
  .row-top .pct{font-size:13px;font-weight:600;}

  .stage1-banner{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;}
  .stage1-banner .left{display:flex;align-items:center;gap:10px;}
  .check-icon{
    width:22px;height:22px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0;
  }
  .stage1-banner .text b{color:var(--text);}
  .stage1-banner .text{font-size:13px;color:var(--muted);line-height:1.6;}
  .stage1-toggle{font-size:12px;color:var(--muted);cursor:pointer;text-decoration:underline;white-space:nowrap;}

  .current-action{border-color:var(--accent);}
  .current-action .tag{font-size:11px;color:var(--accent);font-weight:600;text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px;}
  .current-action .period-name{font-size:17px;font-weight:600;margin-bottom:4px;}
  .current-action .period-amount{font-size:13px;color:var(--muted);line-height:1.8;margin-bottom:12px;}
  .current-action .period-amount b{color:var(--text);}
  .btns{display:flex;gap:8px;flex-wrap:wrap;}
  .mark-btn{
    background:var(--accent);color:#fff;border:none;border-radius:8px;
    padding:10px 16px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;
  }
  .mark-btn.cash{background:var(--purple);}
  .mark-btn.done{background:rgba(62,207,142,0.12);color:var(--good);border:1px solid rgba(62,207,142,.35);cursor:default;}
  .all-done-msg{font-size:14px;color:var(--good);font-weight:600;}
  .viewonly-note{font-size:12px;color:var(--muted);}

  .account-note{font-size:12px;color:var(--muted);}
  .account-note b{color:var(--text);}

  .section-title{font-size:13px;color:var(--muted);margin:22px 0 8px;}

  table{width:100%;border-collapse:collapse;font-size:12.5px;}
  thead th{text-align:left;color:var(--muted);font-weight:500;padding:8px 7px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--card);white-space:nowrap;}
  tbody td{padding:8px 7px;border-bottom:1px solid var(--border);white-space:nowrap;}
  tbody tr.paid{background:rgba(62,207,142,0.05);}
  tbody tr.overdue{background:rgba(255,107,107,0.07);}
  .num{text-align:right;font-variant-numeric:tabular-nums;}

  .badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:500;border:1px solid transparent;user-select:none;}
  .badge.clickable{cursor:pointer;}
  .badge.paid{background:rgba(62,207,142,0.15);color:var(--good);border-color:rgba(62,207,142,.3);}
  .badge.unpaid{background:rgba(138,145,158,0.1);color:var(--muted);border-color:var(--border);}
  .badge.overdue{background:rgba(255,107,107,0.15);color:var(--danger);border-color:rgba(255,107,107,.3);}
  .badge.cash-paid{background:rgba(180,140,255,0.15);color:var(--purple);border-color:rgba(180,140,255,.35);}

  .table-scroll{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:4px 10px;max-height:520px;overflow:auto;}
  .sync-tag{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:5px;margin-top:8px;}
  .dot{width:5px;height:5px;border-radius:50%;background:var(--good);}
  .footer-note{margin-top:20px;font-size:11.5px;color:var(--muted);text-align:center;line-height:1.7;}
</style>
</head>
<body>
<div class="wrap">
  <div class="headrow">
    <div>
      <h1>借款還款進度追蹤</h1>
      <div class="sub">本金 1,800萬元 · 年利率 2% · 目前為唯讀檢視畫面</div>
    </div>
    <button class="lock-btn" id="lockBtn">🔒 編輯</button>

  <div class="grid" id="statGrid"></div>

    <div class="sync-tag"><span class="dot"></span><span id="syncStatus">已同步</span></div>

  <div class="card current-action" id="currentAction"></div>

  <div class="card stage1-banner">

  <div class="card account-note">

  </div>

  <div class="section-title">本息期明細（2026/08/01 起，共 48 期）</div>
  <div class="table-scroll">
    <table id="scheduleTable">

      </thead>
      <tbody id="scheduleBody"></tbody>
    </table>
  </div>

  <div class="footer-note">資料存放於 Google 試算表，任何人開啟此連結皆可查看最新進度，不需要安裝任何 App。</div>
</div>

function toggleLock(){
  if(editMode){
    editMode = false;

    const input = window.prompt('請輸入編輯密碼');
    if(input === null) return;

function updateLockUI(){

async function loadStatus(){
  try{
    const res = await fetch(API_URL + '?action=get');
    const json = await res.json();
    if(json.ok && json.data){ status = JSON.parse(json.data); }
  }catch(e){ /* no data yet, or network issue: use default */ }
  if(status.stage1Done === undefined) status.stage1Done = true;
  loaded = true;
  render();
}

async function saveStatus(){
  document.getElementById('syncStatus').textContent = '同步中...';
  try{
    const url = API_URL + '?action=set&pin=' + encodeURIComponent(EDIT_PIN) + '&data=' + encodeURIComponent(JSON.stringify(status));
    const res = await fetch(url);
    const json = await res.json();
    document.getElementById('syncStatus').textContent = json.ok ? '已同步' : '同步失敗（密碼不符）';
  }catch(e){
    document.getElementById('syncStatus').textContent = '同步失敗，請檢查網路';
  }
}

function toggleStage1(){
  if(!editMode) return;
  status.stage1Done = !status.stage1Done;
  saveStatus();
  render();
}

function toggleStage2(period, kind){
  if(!editMode) return;
  const key = 's2-'+period+'-'+kind;
  const cur = status[key] || {paid:false};
  status[key] = cur.paid ? {paid:false} : {paid:true, paidDate:new Date().toISOString().slice(0,10)};
  saveStatus();
  render();
}

  if(paid) return false;
  const due = new Date(dateStr+'T00:00:00');
  const today = new Date(); today.setHours(0,0,0,0);
  return due < today;
}

    icon.style.color = 'var(--good)';
    text.innerHTML = `<b>第一階段（利息期）已還清</b> — 2025/07–2026/06，共 12 期，合計 360,000 元`;
    toggle.textContent = '標示為未還清';
  } else {
    icon.textContent = '!';
    icon.style.background = 'rgba(255,107,107,.15)';
    icon.style.color = 'var(--danger)';
    text.innerHTML = `<b>第一階段（利息期）尚未還清</b> — 2025/07–2026/06，共 12 期，合計 360,000 元`;
    toggle.textContent = '標示為已還清';
  }
}

function renderCurrentAction(){
  const box = document.getElementById('currentAction');
  const s2Next = stage2.find(r=>{
    const t = status['s2-'+r.period+'-transfer'];
    const c = status['s2-'+r.period+'-cash'];
    return !(t&&t.paid) || !(c&&c.paid);
  });

  if(!s2Next){
    box.innerHTML = `<div class="all-done-msg">🎉 全部 48 期已繳清，借款已還清</div>`;
    return;
  }

  const tPaid = status['s2-'+s2Next.period+'-transfer'] && status['s2-'+s2Next.period+'-transfer'].paid;
  const cPaid = status['s2-'+s2Next.period+'-cash'] && status['s2-'+s2Next.period+'-cash'].paid;
  const overdue = isOverdue(s2Next.date, tPaid && cPaid);

  box.innerHTML = `
    <div class="tag">${overdue?'⚠ 已逾期':'目前應繳'}</div>
    <div class="period-name">第 ${s2Next.period} 期 · ${fmtDate(s2Next.date)}</div>
    <div class="period-amount">應繳合計 <b>${fmt(s2Next.payment)}</b>（本金 ${fmt(s2Next.principal)} ＋ 利息 ${fmt(s2Next.interest)}）</div>
  `;

  if(!editMode){
    box.innerHTML += `<div class="viewonly-note">（開啟編輯模式後可標記繳款）</div>`;
    return;
  }

  const btns = document.createElement('div');
  btns.className = 'btns';
  const tBtn = document.createElement('button');
  tBtn.className = 'mark-btn' + (tPaid?' done':'');
  tBtn.textContent = tPaid ? '✓ 匯款已完成' : `標記匯款 ${fmt(s2Next.transfer)} 已完成`;
  tBtn.onclick = ()=>toggleStage2(s2Next.period,'transfer');
  btns.appendChild(tBtn);

  const cBtn = document.createElement('button');
  cBtn.className = 'mark-btn cash' + (cPaid?' done':'');
  cBtn.textContent = cPaid ? '✓ 現金已還' : `標記現金 ${fmt(s2Next.cash)} 已還`;
  cBtn.onclick = ()=>toggleStage2(s2Next.period,'cash');
  btns.appendChild(cBtn);

  box.appendChild(btns);
}

function renderStage2(){
  const tbody = document.getElementById('scheduleBody');
  const frag = document.createDocumentFragment();
  stage2.forEach(r=>{
    const t = status['s2-'+r.period+'-transfer'] || {paid:false};
    const c = status['s2-'+r.period+'-cash'] || {paid:false};
    const fully = t.paid && c.paid;
    const overdue = isOverdue(r.date, fully);

    const tr = document.createElement('tr');
    tr.className = fully ? 'paid' : (overdue?'overdue':'');
    tr.innerHTML = `
      <td>${r.period}</td>
      <td>${fmtDate(r.date)}</td>
      <td class="num">${fmt(r.payment)}</td>
      <td></td><td></td>
    `;
    const tBadge = document.createElement('span');
    tBadge.className = 'badge ' + (t.paid?'paid':'unpaid') + (editMode?' clickable':'');
    tBadge.textContent = t.paid ? '✓ 已匯' : '未匯';
    if(editMode) tBadge.onclick = ()=>toggleStage2(r.period,'transfer');
    tr.children[3].appendChild(tBadge);

    const cBadge = document.createElement('span');
    cBadge.className = 'badge ' + (c.paid?'cash-paid':'unpaid') + (editMode?' clickable':'');
    cBadge.textContent = c.paid ? '✓ 已還' : `未還 ${fmt(r.cash)}`;
    if(editMode) cBadge.onclick = ()=>toggleStage2(r.period,'cash');
    tr.children[4].appendChild(cBadge);

    frag.appendChild(tr);
  });
  tbody.innerHTML = '';
  tbody.appendChild(frag);
}

function render(){
  renderStage1Banner();
  renderStage2();

  let paidCount = 0, paidPrincipal = 0, totalRepaid = status.stage1Done ? 360000 : 0;

  stage2.forEach(r=>{
    const t = status['s2-'+r.period+'-transfer'];
    const c = status['s2-'+r.period+'-cash'];
    const tp = t && t.paid, cp = c && c.paid;
    if(tp) totalRepaid += r.transfer;
    if(cp){ totalRepaid += r.cash; paidPrincipal += r.principal; }
    if(tp && cp) paidCount++;
  });

  const remainingPrincipal = PRINCIPAL - paidPrincipal;

  document.getElementById('statGrid').innerHTML = `
    <div class="stat"><div class="label">剩餘本金</div><div class="value accent">${fmt(remainingPrincipal)}</div></div>
    <div class="stat"><div class="label">已完成期數</div><div class="value good">${paidCount} / 48</div></div>
    <div class="stat"><div class="label">累積已繳總額</div><div class="value">${fmt(totalRepaid)}</div></div>
  `;

  const pct = Math.round(paidCount/48*100);
  document.getElementById('progressFill').style.width = pct+'%';
  document.getElementById('progressPct').textContent = pct+'%';
  document.getElementById('progressLeft').textContent = `已完成 ${paidCount} 期`;
  document.getElementById('progressRight').textContent = `剩餘 ${48-paidCount} 期，預計 ${fmtDate(stage2[stage2.length-1].date)} 繳清`;

  renderCurrentAction();
}

document.getElementById('lockBtn').onclick = toggleLock;
document.getElementById('stage1Toggle').onclick = toggleStage1;

// 立即用預設資料畫出畫面，不等待雲端同步，避免視覺上感覺很慢
render();
// 再非同步抓取雲端最新狀態並更新
loadStatus();
</script>
</body>
</html>
